workflows:
  telegram-apk:
    name: Telegram APK (auto GiftMenu)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      ndk: r27
      groups:
        - telegram_secrets
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - name: Submodules
        script: |
          git submodule update --init --recursive --depth=1 || true
      - name: local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: gradle.properties
        script: |
          {
            echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-android}"
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS:-androiddebugkey}"
            echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD:-android}"
          } >> "$CM_BUILD_DIR/gradle.properties"
      - name: AUTO inject Gift Menu
        script: |
          cd "$CM_BUILD_DIR"
          python3 test.py
      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR"
          chmod +x ./gradlew
          ./gradlew :TMessagesProj:assembleRelease --stacktrace --no-daemon
    artifacts:
      - TMessagesProj/build/outputs/apk/**/*.apk
      - TMessagesProj/build/outputs/apk/**/*.aab
