workflows:
  telegram-apk:
    name: Telegram APK (auto GiftMenu)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      ndk: r27
      groups:
        - telegram_secrets

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true

    scripts:

      - name: Submodules
        script: |
          git submodule update --init --recursive --depth=1 || true

      - name: local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: gradle.properties
        script: |
          {
            echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-android}"
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS:-androiddebugkey}"
            echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD:-android}"
          } >> "$CM_BUILD_DIR/gradle.properties"

      - name: AUTO inject Gift Menu
        script: |
          cd "$CM_BUILD_DIR"

          echo "===== RUNNING GIFT MENU INJECTOR ====="

          python3 test.py

          echo "===== GIFT MENU INJECTOR FINISHED ====="

      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR"

          chmod +x ./gradlew

          mkdir -p build_logs

          echo "===== START BUILD ====="

          set +e

          ./gradlew :TMessagesProj:assembleRelease \
            --stacktrace \
            --no-daemon \
            2>&1 | tee build_logs/full_build.log

          STATUS=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "===== BUILD FINISHED ====="
          echo "BUILD STATUS: $STATUS"

          {
            echo "===== BUILD STATUS: $STATUS ====="
            echo ""

            echo "===== FAILURE / What went wrong ====="

            grep -n -A 30 -E \
              "FAILURE:|What went wrong:|BUILD FAILED|error:|Execution failed" \
              build_logs/full_build.log \
              | head -n 120 || true

            echo ""

            echo "===== LAST 80 LINES ====="

            tail -n 80 build_logs/full_build.log

          } > build_logs/error_summary.txt

          echo ""
          echo "===== error_summary.txt ====="

          cat build_logs/error_summary.txt

          exit $STATUS

      - name: Find and Prepare APK
        script: |
          cd "$CM_BUILD_DIR"

          echo "========================================"
          echo "        SEARCHING FOR APK FILES"
          echo "========================================"

          mkdir -p artifacts

          rm -f artifacts/*.apk
          rm -f artifacts/*.aab

          echo ""
          echo "===== ALL APK/AAB FILES ====="

          find "$CM_BUILD_DIR" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -not -path "$CM_BUILD_DIR/artifacts/*" \
            -print | sort || true

          echo ""
          echo "========================================"
          echo "              APK FILES"
          echo "========================================"

          APK_COUNT=0

          while IFS= read -r APK; do

            if [ -f "$APK" ]; then

              APK_COUNT=$((APK_COUNT + 1))

              NAME="$(basename "$APK")"

              echo ""
              echo "FOUND APK:"
              echo "$APK"

              echo ""
              echo "COPYING:"
              echo "$APK"

              echo "TO:"
              echo "artifacts/$NAME"

              cp "$APK" "artifacts/$NAME"

            fi

          done < <(
            find "$CM_BUILD_DIR" \
              -type f \
              -name "*.apk" \
              -not -path "$CM_BUILD_DIR/artifacts/*"
          )

          echo ""
          echo "========================================"
          echo "              AAB FILES"
          echo "========================================"

          AAB_COUNT=0

          while IFS= read -r AAB; do

            if [ -f "$AAB" ]; then

              AAB_COUNT=$((AAB_COUNT + 1))

              NAME="$(basename "$AAB")"

              echo ""
              echo "FOUND AAB:"
              echo "$AAB"

              echo ""
              echo "COPYING:"
              echo "$AAB"

              echo "TO:"
              echo "artifacts/$NAME"

              cp "$AAB" "artifacts/$NAME"

            fi

          done < <(
            find "$CM_BUILD_DIR" \
              -type f \
              -name "*.aab" \
              -not -path "$CM_BUILD_DIR/artifacts/*"
          )

          echo ""
          echo "========================================"
          echo "          FINAL ARTIFACTS"
          echo "========================================"

          ls -lah artifacts || true

          echo ""
          echo "APK COUNT: $APK_COUNT"
          echo "AAB COUNT: $AAB_COUNT"

          echo ""
          echo "===== ARTIFACT DIRECTORY ====="

          find artifacts -maxdepth 1 -type f -print 2>/dev/null || true

          if [ "$APK_COUNT" -eq 0 ]; then

            echo ""
            echo "========================================"
            echo "ERROR: APK WAS NOT FOUND!"
            echo "========================================"

            echo ""
            echo "Searching entire project again:"

            find "$CM_BUILD_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "       APK SUCCESSFULLY PREPARED"
          echo "========================================"

    artifacts:
      - artifacts/*.apk
      - artifacts/*.aab
      - build_logs/full_build.log
      - build_logs/error_summary.txt
