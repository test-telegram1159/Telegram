workflows:
  telegram-apk:
    name: Telegram APK (auto GiftMenu)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      ndk: r27

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true

    scripts:
      - name: Submodules
        script: |
          cd "$CM_BUILD_DIR"
          git submodule update --init --recursive --depth=1 || true

      - name: local.properties
        script: |
          cd "$CM_BUILD_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: AUTO inject Gift Menu
        script: |
          cd "$CM_BUILD_DIR"
          python3 test.py

      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR"
          chmod +x ./gradlew
          mkdir -p build_logs

          set +e
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon 2>&1 | tee build_logs/full_build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          {
            echo "===== BUILD STATUS: $STATUS ====="
            echo ""
            echo "===== FAILURE / WHAT WENT WRONG ====="
            grep -n -A 30 -E "FAILURE:|What went wrong:|BUILD FAILED|error:|Execution failed" build_logs/full_build.log | head -n 160 || true
            echo ""
            echo "===== LAST 100 LINES ====="
            tail -n 100 build_logs/full_build.log
          } > build_logs/error_summary.txt

          cat build_logs/error_summary.txt
          exit $STATUS

      - name: Collect APK
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p artifacts
          find "$CM_BUILD_DIR" -type f -name "*.apk" -exec cp -f {} artifacts/ \; 2>/dev/null || true
          find "$CM_BUILD_DIR" -type f -name "*.aab" -exec cp -f {} artifacts/ \; 2>/dev/null || true
          ls -lah artifacts || true

    artifacts:
      - artifacts/*.apk
      - artifacts/*.aab
      - build_logs/full_build.log
      - build_logs/error_summary.txt
