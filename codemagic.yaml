workflows:
  telegram-apk:
    name: Telegram APK (auto GiftMenu)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      ndk: r27
      groups:
        - telegram_secrets

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: "*"
          include: true

    scripts:

      - name: Submodules
        script: |
          git submodule update --init --recursive --depth=1 || true

      - name: local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: gradle.properties
        script: |
          {
            echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-android}"
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS:-androiddebugkey}"
            echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD:-android}"
          } >> "$CM_BUILD_DIR/gradle.properties"

      - name: AUTO inject Gift Menu
        script: |
          cd "$CM_BUILD_DIR"

          echo "========================================"
          echo "       AUTO INJECT GIFT MENU"
          echo "========================================"

          python3 test.py

          echo ""
          echo "Gift Menu injection finished."

      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR"

          chmod +x ./gradlew

          mkdir -p build_logs

          echo "========================================"
          echo "             BUILD APK"
          echo "========================================"

          set +e

          ./gradlew :TMessagesProj:assembleRelease \
            --stacktrace \
            --no-daemon \
            2>&1 | tee build_logs/full_build.log

          STATUS=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "BUILD STATUS: $STATUS"

          {
            echo "===== BUILD STATUS: $STATUS ====="
            echo ""

            echo "===== FAILURE / WHAT WENT WRONG ====="

            grep -n -A 30 -E \
              "FAILURE:|What went wrong:|BUILD FAILED|error:|Execution failed" \
              build_logs/full_build.log \
              | head -n 120 || true

            echo ""

            echo "===== LAST 100 LINES ====="

            tail -n 100 build_logs/full_build.log

          } > build_logs/error_summary.txt

          echo ""
          echo "===== ERROR SUMMARY ====="

          cat build_logs/error_summary.txt

          exit $STATUS

      - name: Collect APK
        script: |
          cd "$CM_BUILD_DIR"

          echo "========================================"
          echo "             COLLECTING APK"
          echo "========================================"

          rm -rf artifacts
          mkdir -p artifacts

          echo ""
          echo "===== SEARCHING FOR APK ====="

          find "$CM_BUILD_DIR" \
            -type f \
            -name "*.apk" \
            -not -path "$CM_BUILD_DIR/artifacts/*" \
            -print | sort || true

          echo ""
          echo "===== COPYING APK ====="

          APK_FOUND=0

          while IFS= read -r APK; do

            if [ -f "$APK" ]; then

              APK_FOUND=1

              NAME="$(basename "$APK")"

              echo ""
              echo "APK FOUND:"
              echo "$APK"

              echo ""
              echo "COPY:"
              echo "$APK"

              echo "TO:"
              echo "$CM_BUILD_DIR/artifacts/$NAME"

              cp -f "$APK" \
                "$CM_BUILD_DIR/artifacts/$NAME"

            fi

          done < <(
            find "$CM_BUILD_DIR" \
              -type f \
              -name "*.apk" \
              -not -path "$CM_BUILD_DIR/artifacts/*"
          )

          echo ""
          echo "========================================"
          echo "             ARTIFACTS"
          echo "========================================"

          ls -lah "$CM_BUILD_DIR/artifacts" || true

          echo ""
          echo "===== FINAL APK FILES ====="

          find "$CM_BUILD_DIR/artifacts" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print || true

          echo ""

          if [ "$APK_FOUND" -eq 0 ]; then

            echo "========================================"
            echo "ERROR: NO APK FOUND"
            echo "========================================"

            echo ""
            echo "Full APK search:"

            find "$CM_BUILD_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "========================================"
          echo "APK SUCCESSFULLY COPIED"
          echo "========================================"

      - name: Collect AAB
        script: |
          cd "$CM_BUILD_DIR"

          echo "===== SEARCHING FOR AAB ====="

          while IFS= read -r AAB; do

            if [ -f "$AAB" ]; then

              NAME="$(basename "$AAB")"

              echo "AAB FOUND:"
              echo "$AAB"

              cp -f "$AAB" \
                "$CM_BUILD_DIR/artifacts/$NAME"

            fi

          done < <(
            find "$CM_BUILD_DIR" \
              -type f \
              -name "*.aab" \
              -not -path "$CM_BUILD_DIR/artifacts/*"
          )

          echo ""
          echo "===== FINAL ARTIFACT DIRECTORY ====="

          ls -lah "$CM_BUILD_DIR/artifacts" || true

    artifacts:
      - artifacts/*.apk
      - artifacts/*.aab
      - build_logs/full_build.log
      - build_logs/error_summary.txt
