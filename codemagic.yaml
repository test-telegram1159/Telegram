workflows:
  telegram-apk:
    name: Telegram APK (auto GiftMenu)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      ndk: r27
      groups:
        - telegram_secrets
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - name: Submodules
        script: |
          git submodule update --init --recursive --depth=1 || true

      - name: local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: gradle.properties
        script: |
          {
            echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-android}"
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS:-androiddebugkey}"
            echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD:-android}"
          } >> "$CM_BUILD_DIR/gradle.properties"

      - name: AUTO inject Gift Menu
        script: |
          cd "$CM_BUILD_DIR"
          python3 test.py

      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR"
          chmod +x ./gradlew
          mkdir -p build_logs

          set +e
          ./gradlew :TMessagesProj:assembleRelease --stacktrace --no-daemon 2>&1 | tee build_logs/full_build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          # Короткая выжимка ошибки (удобно скинуть в чат)
          {
            echo "===== BUILD STATUS: $STATUS ====="
            echo ""
            echo "===== FAILURE / What went wrong ====="
            grep -n -A 30 -E "FAILURE:|What went wrong:|BUILD FAILED|error:|Execution failed" build_logs/full_build.log | head -n 120 || true
            echo ""
            echo "===== LAST 80 LINES ====="
            tail -n 80 build_logs/full_build.log
          } > build_logs/error_summary.txt

          echo "----- error_summary.txt -----"
          cat build_logs/error_summary.txt

          exit $STATUS

    artifacts:
      - TMessagesProj/build/outputs/apk/**/*.apk
      - TMessagesProj/build/outputs/apk/**/*.aab
      - build_logs/full_build.log
      - build_logs/error_summary.txt
