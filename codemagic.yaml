workflows:
  telegram-apk:
    name: Telegram APK (auto GiftMenu)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      ndk: r27
      groups:
        - telegram_secrets

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: "*"
          include: true

    scripts:

      # ========================================
      # SUBMODULES
      # ========================================

      - name: Submodules
        script: |
          cd "$CM_BUILD_DIR"

          git submodule update --init --recursive --depth=1 || true

      # ========================================
      # LOCAL PROPERTIES
      # ========================================

      - name: local.properties
        script: |
          cd "$CM_BUILD_DIR"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ========================================
      # CHECK SIGNING BEFORE BUILD
      # ========================================

      - name: Validate signing
        script: |
          cd "$CM_BUILD_DIR"

          echo "========================================"
          echo "       VALIDATING RELEASE SIGNING"
          echo "========================================"

          KEYSTORE="$CM_BUILD_DIR/TMessagesProj/config/release.keystore"

          # ----------------------------------------
          # 1. Проверяем keystore
          # ----------------------------------------

          echo ""
          echo "[1/5] Checking release.keystore..."

          if [ ! -f "$KEYSTORE" ]; then
            echo ""
            echo "ERROR: release.keystore NOT FOUND!"
            echo ""
            echo "Expected:"
            echo "$KEYSTORE"
            echo ""
            echo "Build stopped before Gradle."
            exit 1
          fi

          echo "OK: keystore exists."

          # ----------------------------------------
          # 2. Проверяем пароль keystore
          # ----------------------------------------

          echo ""
          echo "[2/5] Checking RELEASE_STORE_PASSWORD..."

          if [ -z "${RELEASE_STORE_PASSWORD:-}" ]; then
            echo ""
            echo "ERROR: RELEASE_STORE_PASSWORD is empty!"
            echo ""
            echo "Build stopped before Gradle."
            exit 1
          fi

          echo "OK: RELEASE_STORE_PASSWORD is set."

          # ----------------------------------------
          # 3. Читаем keystore
          # ----------------------------------------

          echo ""
          echo "[3/5] Reading keystore..."

          KEYTOOL_OUTPUT="$(
            keytool \
              -list \
              -v \
              -keystore "$KEYSTORE" \
              -storepass "$RELEASE_STORE_PASSWORD" \
              2>&1
          )"

          KEYTOOL_STATUS=$?

          if [ "$KEYTOOL_STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "ERROR: CANNOT OPEN KEYSTORE"
            echo "========================================"

            echo ""
            echo "$KEYTOOL_OUTPUT"

            echo ""
            echo "Most likely:"
            echo "- RELEASE_STORE_PASSWORD is wrong"
            echo "- release.keystore is damaged"

            echo ""
            echo "Build stopped BEFORE Gradle."
            exit 1
          fi

          echo "OK: keystore password is correct."

          # ----------------------------------------
          # 4. Получаем настоящий alias
          # ----------------------------------------

          echo ""
          echo "[4/5] Detecting key alias..."

          ALIAS="$(
            echo "$KEYTOOL_OUTPUT" \
              | grep -E "Alias name:" \
              | head -n 1 \
              | sed 's/.*Alias name: //' \
              | tr -d '\r'
          )"

          if [ -z "$ALIAS" ]; then

            echo ""
            echo "========================================"
            echo "ERROR: NO KEY ALIAS FOUND"
            echo "========================================"

            echo ""
            echo "Available keystore information:"
            echo "$KEYTOOL_OUTPUT"

            echo ""
            echo "Build stopped BEFORE Gradle."
            exit 1
          fi

          echo "Detected alias:"
          echo "$ALIAS"

          # ----------------------------------------
          # 5. Проверяем пароль ключа
          # ----------------------------------------

          echo ""
          echo "[5/5] Checking RELEASE_KEY_PASSWORD..."

          if [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then

            echo ""
            echo "ERROR: RELEASE_KEY_PASSWORD is empty!"
            echo ""
            echo "Build stopped BEFORE Gradle."
            exit 1
          fi

          KEY_CHECK="$(
            keytool \
              -certreq \
              -alias "$ALIAS" \
              -keystore "$KEYSTORE" \
              -storepass "$RELEASE_STORE_PASSWORD" \
              -keypass "$RELEASE_KEY_PASSWORD" \
              -file "$CM_BUILD_DIR/.signing_test.csr" \
              2>&1
          )"

          KEY_STATUS=$?

          rm -f "$CM_BUILD_DIR/.signing_test.csr"

          if [ "$KEY_STATUS" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "ERROR: KEY PASSWORD / ALIAS INVALID"
            echo "========================================"

            echo ""
            echo "$KEY_CHECK"

            echo ""
            echo "Detected alias:"
            echo "$ALIAS"

            echo ""
            echo "Check:"
            echo "RELEASE_KEY_PASSWORD"

            echo ""
            echo "Build stopped BEFORE Gradle."
            exit 1
          fi

          echo "OK: key password is correct."

          # ========================================
          # SIGNING IS VALID
          # ========================================

          echo ""
          echo "========================================"
          echo "       SIGNING VALIDATION PASSED"
          echo "========================================"

          echo ""
          echo "Keystore: OK"
          echo "Store password: OK"
          echo "Alias: $ALIAS"
          echo "Key password: OK"

          echo ""
          echo "Gradle build can start."

          # ========================================
          # CREATE GRADLE PROPERTIES
          # ========================================

          cat > "$CM_BUILD_DIR/gradle.properties" <<EOF
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          RELEASE_KEY_ALIAS=$ALIAS
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          EOF

          echo ""
          echo "gradle.properties prepared."

      # ========================================
      # GIFT MENU
      # ========================================

      - name: AUTO inject Gift Menu
        script: |
          cd "$CM_BUILD_DIR"

          echo "========================================"
          echo "       AUTO INJECT GIFT MENU"
          echo "========================================"

          python3 test.py

          echo ""
          echo "Gift Menu injection finished."

      # ========================================
      # BUILD APK
      # ========================================

      - name: Build APK
        script: |
          cd "$CM_BUILD_DIR"

          chmod +x ./gradlew

          mkdir -p build_logs

          echo "========================================"
          echo "             BUILD APK"
          echo "========================================"

          echo ""
          echo "Task:"
          echo ":TMessagesProj_App:assembleAfatRelease"

          set +e

          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            --stacktrace \
            --no-daemon \
            2>&1 | tee build_logs/full_build.log

          STATUS=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "BUILD STATUS: $STATUS"

          {
            echo "===== BUILD STATUS: $STATUS ====="
            echo ""

            echo "===== FAILURE / WHAT WENT WRONG ====="

            grep -n -A 30 -E \
              "FAILURE:|What went wrong:|BUILD FAILED|error:|Execution failed|KeytoolException" \
              build_logs/full_build.log \
              | head -n 160 || true

            echo ""

            echo "===== LAST 100 LINES ====="

            tail -n 100 build_logs/full_build.log

          } > build_logs/error_summary.txt

          echo ""
          echo "===== ERROR SUMMARY ====="

          cat build_logs/error_summary.txt

          exit $STATUS

      # ========================================
      # COLLECT APK
      # ========================================

      - name: Collect APK
        script: |
          cd "$CM_BUILD_DIR"

          echo "========================================"
          echo "             COLLECTING APK"
          echo "========================================"

          rm -rf artifacts
          mkdir -p artifacts

          echo ""
          echo "===== SEARCHING FOR APK ====="

          find "$CM_BUILD_DIR/TMessagesProj_App" \
            -type f \
            -name "*.apk" \
            -print \
            | sort \
            || true

          echo ""
          echo "===== COPYING APK ====="

          APK_FOUND=0

          while IFS= read -r APK; do

            if [ -f "$APK" ]; then

              APK_FOUND=1

              NAME="$(basename "$APK")"

              echo ""
              echo "APK FOUND:"
              echo "$APK"

              echo ""
              echo "COPYING TO:"
              echo "$CM_BUILD_DIR/artifacts/$NAME"

              cp -f \
                "$APK" \
                "$CM_BUILD_DIR/artifacts/$NAME"

            fi

          done < <(
            find "$CM_BUILD_DIR/TMessagesProj_App" \
              -type f \
              -name "*.apk"
          )

          echo ""
          echo "========================================"
          echo "          FINAL ARTIFACTS"
          echo "========================================"

          ls -lah "$CM_BUILD_DIR/artifacts" || true

          echo ""
          echo "===== FINAL APK FILES ====="

          find "$CM_BUILD_DIR/artifacts" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            || true

          if [ "$APK_FOUND" -eq 0 ]; then

            echo ""
            echo "========================================"
            echo "ERROR: APK WAS NOT FOUND"
            echo "========================================"

            echo ""
            echo "Full APK search:"

            find "$CM_BUILD_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "       APK SUCCESSFULLY COPIED"
          echo "========================================"

      # ========================================
      # COLLECT AAB
      # ========================================

      - name: Collect AAB
        script: |
          cd "$CM_BUILD_DIR"

          echo "========================================"
          echo "             COLLECTING AAB"
          echo "========================================"

          while IFS= read -r AAB; do

            if [ -f "$AAB" ]; then

              NAME="$(basename "$AAB")"

              echo ""
              echo "AAB FOUND:"
              echo "$AAB"

              cp -f \
                "$AAB" \
                "$CM_BUILD_DIR/artifacts/$NAME"

            fi

          done < <(
            find "$CM_BUILD_DIR/TMessagesProj_App" \
              -type f \
              -name "*.aab"
          )

          echo ""
          echo "===== FINAL ARTIFACT DIRECTORY ====="

          ls -lah "$CM_BUILD_DIR/artifacts" || true

    # ========================================
    # ARTIFACTS
    # ========================================

    artifacts:
      - artifacts/*.apk
      - artifacts/*.aab
      - build_logs/full_build.log
      - build_logs/error_summary.txt
